<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Damon Lee</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0d1117" />
    <!-- The last copy of --bg / --fg anywhere: this file is copied verbatim and
         can import nothing, so the grounds are spelled out and have to be
         re-synced by hand when portfolio.scss changes. The link takes the ink
         rather than a third copy of --accent — it only ever shows with JS off.
         The media query covers that case; the script below upgrades it to the
         visitor's stored choice when there is one. -->
    <style>
      html,body{margin:0;height:100%;background:#0d1117;color:#e6edf3}
      @media (prefers-color-scheme: light){html:not([data-theme='dark']),html:not([data-theme='dark']) body{background:#f1ede9;color:#1f2328}}
      html[data-theme='light'],html[data-theme='light'] body{background:#f1ede9;color:#1f2328}
      a{color:inherit;text-decoration:underline}
    </style>
    <script>
      // GitHub Pages serves this file for any path it cannot resolve in /docs.
      // The site is hash-routed, so fold the requested path into the hash and
      // hand it to the router: /work -> /#/work, /pizza -> /#/pizza, which the
      // catch-all in router/routes.js then redirects to /#/.
      //
      // This runs before the bundle loads, on purpose. Serving a copy of
      // index.html here instead would boot the app at /pizza, and
      // createWebHashHistory() would take /pizza# as its base — leaving every
      // route nested under /pizza#/ for the rest of the session.
      //
      // replace() keeps the dead URL out of history, so Back leaves the site
      // rather than bouncing through the redirect again.
      (function () {
        // Same key and precedence as the pre-paint script in index.html, so an
        // overridden theme doesn't flash the other ground on the way through.
        try {
          var t = localStorage.getItem('melonade-theme')
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        } catch (e) { /* private mode: the media query above still applies */ }

        var l = window.location
        var path = l.pathname.replace(/^\/+/, '').replace(/\/+$/, '')
        l.replace(l.origin + '/#/' + path + l.search)
      })()
    </script>
  </head>
  <body>
    <noscript>
      <p style="font-family:sans-serif;padding:2rem">
        Page not found. <a href="/">Go to melonade.me</a>
      </p>
    </noscript>
  </body>
</html>
